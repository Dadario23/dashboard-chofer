<!DOCTYPE html>
<html lang="es-AR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0e0e0e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Panel de Reparto · Depósito</title>
<style>
  :root {
    --bg:#0e0e0e;--surface:#1a1a1a;--surface2:#242424;--surface3:#2e2e2e;--border:#2e2e2e;
    --text1:#f0f0f0;--text2:#aaaaaa;--text3:#555555;
    --green:#25c490;--green-bg:#0d2e22;--green-border:#1a4d38;
    --amber:#e89b2a;--amber-bg:#2d1f0a;
    --red:#e05555;--red-bg:#2e1111;--red-border:#4d1e1e;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh}
  .page{display:flex;flex-direction:column;min-height:100dvh}

  /* HEADER */
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px 14px;position:sticky;top:0;z-index:10}
  .header-top{display:flex;align-items:center;gap:10px}
  .header-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse-glow 2.2s ease-in-out infinite}
  @keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(37,196,144,.6)}50%{box-shadow:0 0 0 6px rgba(37,196,144,0)}}
  .header-title{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
  .header-live{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.6px}
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 1.8s ease-in-out infinite}
  @keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
  .header-sub{font-size:13px;color:var(--text2);margin-top:5px;padding-left:20px}

  /* BODY */
  .dash-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
  .section-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--text3);padding-left:4px}

  /* GLOBAL METRICS */
  .metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px}
  .metric-card.green{border-color:rgba(37,196,144,.3);background:var(--green-bg)}
  .metric-card.amber{border-color:rgba(232,155,42,.3);background:var(--amber-bg)}
  .metric-card.red{border-color:rgba(224,85,85,.3);background:var(--red-bg)}
  .metric-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .metric-card.green .metric-label{color:var(--green)}.metric-card.amber .metric-label{color:var(--amber)}.metric-card.red .metric-label{color:var(--red)}
  .metric-num{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--text1)}

  /* DRIVER CARD */
  .driver-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .3s}
  .driver-card.active-now{border-color:rgba(37,196,144,.4)}
  .driver-header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
  .driver-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-bg);border:2px solid var(--green-border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--green);flex-shrink:0}
  .driver-info{flex:1}
  .driver-name{font-size:16px;font-weight:700;color:var(--text1)}
  .driver-zone{font-size:12px;color:var(--green);margin-top:2px}
  .driver-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid}
  .driver-status.active{color:var(--green);border-color:rgba(37,196,144,.3);background:var(--green-bg)}
  .driver-status.finished{color:var(--text3);border-color:var(--border);background:var(--surface2)}

  .driver-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border)}
  .driver-stat{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-right:1px solid var(--border)}
  .driver-stat:last-child{border-right:none}
  .driver-stat-num{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.04em}
  .driver-stat-num.green{color:var(--green)}.driver-stat-num.red{color:var(--red)}.driver-stat-num.amber{color:var(--amber)}
  .driver-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-top:3px}

  .driver-progress{padding:10px 14px;border-top:1px solid var(--border)}
  .mini-track{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;display:flex;margin-bottom:5px}
  .mini-g{height:100%;background:var(--green);border-radius:99px;transition:width .6s ease}
  .mini-r{height:100%;background:var(--red);border-radius:99px;transition:width .6s ease}
  .progress-txt{font-size:11px;color:var(--text2);text-align:center}

  /* ZONE ROW inside driver card */
  .driver-zones{border-top:1px solid var(--border);padding:10px 14px;display:flex;flex-direction:column;gap:7px}
  .zone-row{display:flex;align-items:center;gap:8px}
  .zone-row-name{font-size:12px;color:var(--text2);flex:1}
  .zone-row-stat{font-size:12px;font-weight:600;min-width:28px;text-align:right}
  .zone-active-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse-dot 1.4s ease-in-out infinite}

  /* FOOTER */
  .footer{background:var(--surface);border-top:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .footer-ts{font-size:11px;color:var(--text3);flex:1}
  .conn-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid}
  .conn-badge.connected{color:var(--green);border-color:rgba(37,196,144,.3);background:var(--green-bg)}
  .conn-badge.disconnected{color:var(--red);border-color:rgba(224,85,85,.3);background:var(--red-bg)}
  .conn-dot{width:6px;height:6px;border-radius:50%;background:currentColor}

  .waiting{text-align:center;padding:32px 20px;color:var(--text3);font-size:14px;font-style:italic}

  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
  .bumping{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
</style>
</head>
<body>
<div class="page">

  <div class="header">
    <div class="header-top">
      <div class="header-dot"></div>
      <div class="header-title">Panel de Reparto</div>
      <div class="header-live"><div class="live-dot"></div>En vivo</div>
    </div>
    <div class="header-sub" id="header-date">Cargando...</div>
  </div>

  <div class="dash-body">

    <!-- TOTALES GLOBALES -->
    <div class="section-title">Totales del día</div>
    <div class="metrics-grid">
      <div class="metric-card green"><div class="metric-label">Entregados</div><div class="metric-num" id="g-delivered">—</div></div>
      <div class="metric-card amber"><div class="metric-label">Restantes</div><div class="metric-num" id="g-remaining">—</div></div>
      <div class="metric-card red"><div class="metric-label">No entreg.</div><div class="metric-num" id="g-failed">—</div></div>
    </div>

    <!-- CHOFERES -->
    <div class="section-title">Choferes en ruta</div>
    <div id="drivers-container"><div class="waiting">Esperando datos de los choferes...</div></div>

  </div>

  <div class="footer">
    <div class="footer-ts" id="footer-ts">Sin datos aún</div>
    <div class="conn-badge connected" id="conn-badge"><div class="conn-dot"></div>Conectado</div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey:"AIzaSyC8SLmgOK2LfnzK-PiZQKCl9WdVfO4ISys",
  authDomain:"chofer-ml.firebaseapp.com",
  databaseURL:"https://chofer-ml-default-rtdb.firebaseio.com",
  projectId:"chofer-ml",
  storageBucket:"chofer-ml.firebasestorage.app",
  messagingSenderId:"648556111731",
  appId:"1:648556111731:web:298b201b8b9f0f5c47c706"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const ZONE_NAMES = {
  'florencio-varela-berazategui':'Florencio Varela/Berazategui','la-plata':'La Plata',
  'quilmes':'Quilmes','lomas-de-zamora':'Lomas de Zamora','esteban-etcheverria':'Esteban Etcheverría',
  'ezeiza':'Ezeiza','zona-1':'Zona 1','zona-2':'Zona 2','zona-3':'Zona 3',
  'zona-4':'Zona 4','zona-5':'Zona 5','pilar':'Pilar'
};

function todayStr(){
  return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');
}
function todayFmt(){
  return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    weekday:'long',day:'numeric',month:'long'});
}
function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function zoneName(k){ return ZONE_NAMES[k] || k || '—'; }
function initials(name){ return name ? name.charAt(0).toUpperCase() : '?'; }
function bump(el){ if(!el) return; el.classList.remove('bumping'); void el.offsetWidth; el.classList.add('bumping'); el.addEventListener('animationend',()=>el.classList.remove('bumping'),{once:true}); }
function setConnected(ok){
  const b=document.getElementById('conn-badge');
  b.className=`conn-badge ${ok?'connected':'disconnected'}`;
  b.innerHTML=`<div class="conn-dot"></div>${ok?'Conectado':'Sin conexión'}`;
}

document.getElementById('header-date').textContent = todayFmt();

// Track previous totals per driver for bump detection
const prevTotals = {};
// Cache apodos from /usuarios
const apodos = {};

// Load user profiles once
onValue(ref(db,'usuarios'), snap => {
  if(!snap.exists()) return;
  snap.forEach(child => {
    const uid  = child.key;
    const data = child.val();
    apodos[uid] = data.apodo || uid;
  });
});

// Listen to today's full jornada node
onValue(ref(db, `jornadas/${todayStr()}`), (snapshot) => {
  setConnected(true);

  if(!snapshot.exists()){
    document.getElementById('drivers-container').innerHTML =
      '<div class="waiting">Esperando datos de los choferes...</div>';
    return;
  }

  const data = snapshot.val();

  // Each top-level key is a uid (driver)
  const drivers = Object.entries(data);
  if(drivers.length === 0) return;

  // Compute global totals
  let gDelivered=0, gFailed=0, gRemaining=0, latestTs='';

  drivers.forEach(([uid, driverData]) => {
    const meta = driverData['_meta'] || {};
    gDelivered += meta.totalDelivered || 0;
    gFailed    += meta.totalFailed    || 0;
    gRemaining += meta.totalRemaining || 0;
    if(meta.updatedAt && meta.updatedAt > latestTs) latestTs = meta.updatedAt;
  });

  // Global metrics
  document.getElementById('g-delivered').textContent = gDelivered;
  document.getElementById('g-remaining').textContent = gRemaining;
  document.getElementById('g-failed').textContent    = gFailed;

  // Render driver cards
  const container = document.getElementById('drivers-container');
  container.innerHTML = '';

  drivers.forEach(([uid, driverData]) => {
    const meta       = driverData['_meta'] || {};
    const apodo      = apodos[uid] || meta.userName || uid.slice(0,8);
    const activeZone = meta.activeZone || '';
    const delivered  = meta.totalDelivered || 0;
    const failed     = meta.totalFailed    || 0;
    const remaining  = meta.totalRemaining || 0;
    const total      = meta.totalPackages  || 0;
    const managed    = delivered + failed;
    const pct        = total > 0 ? Math.round(managed/total*100) : 0;
    const isFinished = !!meta.finishedAt;
    const updatedAt  = meta.updatedAt || '';

    const prev       = prevTotals[uid] || {};
    const didDeliver = delivered > (prev.delivered || 0);
    const didFail    = failed    > (prev.failed    || 0);
    prevTotals[uid]  = { delivered, failed, remaining };

    const pctG = total > 0 ? (delivered/total*100) : 0;
    const pctR = total > 0 ? (failed/total*100)    : 0;

    // Zone rows
    const zoneKeys = Object.keys(driverData).filter(k => k !== '_meta');
    const zonesHtml = zoneKeys.map(key => {
      const z       = driverData[key];
      const isActive = key === activeZone;
      return `
        <div class="zone-row">
          ${isActive ? '<div class="zone-active-dot"></div>' : '<div style="width:6px"></div>'}
          <div class="zone-row-name">${zoneName(key)}</div>
          <div class="zone-row-stat" style="color:var(--green)">${z.delivered||0}✓</div>
          <div class="zone-row-stat" style="color:var(--red)">${z.failed||0}✕</div>
          <div class="zone-row-stat" style="color:var(--amber)">${z.remaining||0}⏳</div>
        </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = `driver-card${!isFinished ? ' active-now' : ''}`;
    card.id = `driver-${uid}`;
    card.innerHTML = `
      <div class="driver-header">
        <div class="driver-avatar">${initials(apodo)}</div>
        <div class="driver-info">
          <div class="driver-name">${apodo}</div>
          ${activeZone && !isFinished
            ? `<div class="driver-zone">📍 ${zoneName(activeZone)}</div>`
            : ''}
        </div>
        <div class="driver-status ${isFinished ? 'finished' : 'active'}">
          ${isFinished ? 'Finalizado' : 'En ruta'}
        </div>
      </div>
      <div class="driver-stats">
        <div class="driver-stat">
          <div class="driver-stat-num green" id="d-${uid}-delivered">${delivered}</div>
          <div class="driver-stat-label">Entregados</div>
        </div>
        <div class="driver-stat">
          <div class="driver-stat-num red" id="d-${uid}-failed">${failed}</div>
          <div class="driver-stat-label">No entreg.</div>
        </div>
        <div class="driver-stat">
          <div class="driver-stat-num amber" id="d-${uid}-remaining">${remaining}</div>
          <div class="driver-stat-label">Restantes</div>
        </div>
      </div>
      <div class="driver-progress">
        <div class="mini-track">
          <div class="mini-g" style="width:${pctG}%"></div>
          <div class="mini-r" style="width:${pctR}%"></div>
        </div>
        <div class="progress-txt">${managed} de ${total} gestionados · ${pct}%${updatedAt ? ' · ' + fmtTime(updatedAt) : ''}</div>
      </div>
      ${zoneKeys.length > 0 ? `<div class="driver-zones">${zonesHtml}</div>` : ''}
    `;
    container.appendChild(card);

    // Bump animations
    if(didDeliver) { setTimeout(()=>{ bump(document.getElementById(`d-${uid}-delivered`)); bump(document.getElementById(`d-${uid}-remaining`)); },50); }
    if(didFail)    { setTimeout(()=>{ bump(document.getElementById(`d-${uid}-failed`));    bump(document.getElementById(`d-${uid}-remaining`)); },50); }
  });

  document.getElementById('footer-ts').textContent =
    latestTs ? 'Actualizado ' + fmtTime(latestTs) : 'Sin datos aún';

}, err => { console.error(err); setConnected(false); });
</script>
</body>
</html>
