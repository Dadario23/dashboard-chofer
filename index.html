<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f6f7f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Panel de Reparto · Depósito</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--surface:#ffffff;--surface2:#f0f2f5;--border:#e3e6eb;--text1:#111827;--text2:#5b6472;--text3:#98a1ae;--green:#0b8a5f;--green-bg:#e6f6ef;--green-border:#bfe6d4;--amber:#b7791f;--amber-bg:#fdf3e1;--red:#d64545;--red-bg:#fdecec;--red-border:#f6c7c7;--orange:#d9631e;--radius:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px 0;flex-shrink:0;z-index:100}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.header-dot{width:10px;height:10px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse-glow 2.2s ease-in-out infinite}
@keyframes pulse-glow{0%,100%{box-shadow:0 0 0 0 rgba(11,138,95,.6)}50%{box-shadow:0 0 0 6px rgba(11,138,95,0)}}
.header-title{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.header-live{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--green);text-transform:uppercase}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse-dot 1.8s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
.tabs{display:flex;border-bottom:1px solid var(--border)}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tab.active{color:var(--green);border-bottom-color:var(--green)}
.screen{display:none;flex:1;overflow-y:auto;flex-direction:column}
.screen.active{display:flex}
#screen-mapa{overflow:hidden}
.dash-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600;color:var(--text3);padding-left:4px}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:5px}
.metric-card.green{border-color:rgba(11,138,95,.3);background:var(--green-bg)}.metric-card.amber{border-color:rgba(183,121,31,.3);background:var(--amber-bg)}.metric-card.red{border-color:rgba(214,69,69,.3);background:var(--red-bg)}
.metric-label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.metric-card.green .metric-label{color:var(--green)}.metric-card.amber .metric-label{color:var(--amber)}.metric-card.red .metric-label{color:var(--red)}
.metric-num{font-size:40px;font-weight:700;line-height:1;letter-spacing:-1.5px;color:var(--text1)}
.driver-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer}
.driver-card:active{opacity:.85}.driver-card.active-now{border-color:rgba(11,138,95,.4)}
.driver-header{display:flex;align-items:center;gap:10px;padding:14px 16px 12px}
.driver-avatar{width:38px;height:38px;border-radius:50%;background:var(--green-bg);border:2px solid var(--green-border);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--green);flex-shrink:0}
.driver-info{flex:1}.driver-name{font-size:16px;font-weight:700;color:var(--text1)}.driver-zone{font-size:12px;color:var(--green);margin-top:2px}
.driver-status{font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;border:1px solid}
.driver-status.active{color:var(--green);border-color:rgba(11,138,95,.3);background:var(--green-bg)}
.driver-status.finished{color:var(--text3);border-color:var(--border);background:var(--surface2)}
.driver-stats{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--border)}
.driver-stat{display:flex;flex-direction:column;align-items:center;padding:12px 8px;border-right:1px solid var(--border)}.driver-stat:last-child{border-right:none}
.driver-stat-num{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.04em}
.driver-stat-num.green{color:var(--green)}.driver-stat-num.red{color:var(--red)}.driver-stat-num.amber{color:var(--amber)}
.driver-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--text3);margin-top:3px}
.driver-hint{font-size:11px;color:var(--text3);text-align:center;padding:8px;border-top:1px solid var(--border)}
.waiting{text-align:center;padding:32px;color:var(--text3);font-size:14px;font-style:italic}
.detail-screen{display:none;flex:1;flex-direction:column}
.detail-screen.active{display:flex}
.btn-back{background:var(--surface2);border:1px solid var(--border);color:var(--text1);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.detail-summary{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:14px}
.detail-avatar{width:52px;height:52px;border-radius:50%;background:var(--green-bg);border:2px solid var(--green-border);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--green);flex-shrink:0}
.detail-name{font-size:20px;font-weight:700;color:var(--text1);margin-bottom:4px}.detail-meta{font-size:12px;color:var(--text2);line-height:1.6}
.detail-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.detail-stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 8px;text-align:center}
.detail-stat-num{font-size:24px;font-weight:700;line-height:1}
.detail-stat-num.green{color:var(--green)}.detail-stat-num.red{color:var(--red)}.detail-stat-num.amber{color:var(--amber)}.detail-stat-num.white{color:var(--text1)}
.detail-stat-label{font-size:9px;text-transform:uppercase;color:var(--text3);margin-top:3px}
.reason-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.reason-name{font-size:13px;color:var(--text2)}.reason-count{font-size:16px;font-weight:700;color:var(--red)}
.pkg{background:var(--surface);border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:3px solid}
.pkg.delivered{border-color:var(--green)}.pkg.failed{border-color:var(--orange)}
.pkg-row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.pkg-status{font-size:13px;font-weight:700}.pkg-status.delivered{color:var(--green)}.pkg-status.failed{color:var(--orange)}
.pkg-time{font-size:11px;color:var(--text3)}.pkg-zone{font-size:12px;color:var(--text2);margin-bottom:3px}
.pkg-loc{font-size:12px;color:var(--text2);display:flex;gap:4px}.pkg-reason{font-size:12px;color:var(--orange);margin-top:4px;font-style:italic}
/* MAP */
#map-container{display:flex;flex-direction:column;height:100%}
#map-filters{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.mf-row{display:flex;align-items:center;gap:8px}
#map-driver-select,.mf-field select,.mf-field input{background:var(--surface2);border:1px solid var(--border);color:var(--text1);padding:7px 10px;border-radius:8px;font-size:13px;min-width:0;width:100%}
#map-driver-select{flex:1}
.mf-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text1);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.mf-btn .badge{display:inline-block;min-width:16px;padding:0 5px;margin-left:6px;border-radius:99px;background:var(--green);color:#fff;font-size:10px;line-height:16px}
#mf-panel{display:none;flex-direction:column;gap:10px;max-height:42vh;overflow-y:auto}
#mf-panel.open{display:flex}
.mf-chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text1);background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:5px 10px;cursor:pointer}
.mf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mf-field{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:600;color:var(--text2)}
.mf-field.wide{grid-column:1/-1}
.mf-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
#map-count{font-weight:700;color:var(--text1)}
.map-legend{display:flex;align-items:center;gap:12px;margin-left:auto;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.legend-dot.green{background:#0b8a5f}.legend-dot.orange{background:#d9631e}
#leaflet-map{flex:1;min-height:0}
.footer{background:var(--surface);border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.footer-ts{font-size:11px;color:var(--text3);flex:1}
.conn-badge{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid}
.conn-badge.connected{color:var(--green);border-color:rgba(11,138,95,.3);background:var(--green-bg)}
.conn-badge.disconnected{color:var(--red);border-color:rgba(214,69,69,.3);background:var(--red-bg)}
.conn-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
/* Leaflet popups */
.leaflet-popup-content-wrapper{background:var(--surface);color:var(--text1);border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.6}
.popup-title{font-weight:700;font-size:14px;margin-bottom:4px}
.popup-title.green{color:var(--green)}.popup-title.orange{color:var(--orange)}.popup-title.blue{color:#3b82f6}
.popup-row{color:var(--text2);font-size:12px}.popup-row span{color:var(--text1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.bumping{animation:bump .35s cubic-bezier(.34,1.56,.64,1)}
.tag-part{font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--amber);background:var(--amber-bg);border:1px solid rgba(183,121,31,.3);border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.part-left{font-size:11px;font-weight:600;color:var(--amber);margin-top:2px}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div class="header-dot"></div>
      <div class="header-title">Panel de Reparto</div>
      <div class="header-live"><div class="live-dot"></div>En vivo</div>
    </div>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('reparto')">Reparto</div>
      <div class="tab" onclick="switchTab('mapa')">Mapa</div>
    </div>
  </div>

  <!-- REPARTO -->
  <div id="screen-reparto" class="screen active">
    <div id="view-list" style="display:flex;flex-direction:column;flex:1">
      <div class="dash-body">
        <div class="section-title">Totales del día</div>
        <div class="metrics-grid">
          <div class="metric-card green"><div class="metric-label">Entregados</div><div class="metric-num" id="g-delivered">—</div></div>
          <div class="metric-card amber"><div class="metric-label">Restantes</div><div class="metric-num" id="g-remaining">—</div><div class="part-left" id="g-part" style="display:none"></div></div>
          <div class="metric-card red"><div class="metric-label">No entreg.</div><div class="metric-num" id="g-failed">—</div></div>
        </div>
        <div class="section-title">Choferes en ruta</div>
        <div id="drivers-container"><div class="waiting">Esperando datos...</div></div>
      </div>
    </div>
    <div id="view-detail" class="detail-screen">
      <div class="dash-body">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:4px">
          <button class="btn-back" onclick="goBack()">← Volver</button>
          <div>
            <div style="font-size:18px;font-weight:700" id="detail-title">Detalle</div>
            <div style="font-size:12px;color:var(--text2)" id="detail-sub"></div>
          </div>
        </div>
        <div id="detail-body"><div class="waiting">Cargando...</div></div>
      </div>
    </div>
  </div>

  <!-- MAPA -->
  <div id="screen-mapa" class="screen">
    <div id="map-container">
      <div id="map-filters">
        <div class="mf-row">
          <select id="map-driver-select" onchange="applyMapFilter()">
            <option value="all">Todos los choferes</option>
          </select>
          <button class="mf-btn" onclick="toggleFilters()">Filtros ▾<span class="badge" id="mf-badge" style="display:none"></span></button>
        </div>
        <div id="mf-panel" oninput="applyMapFilter()">
          <div class="mf-chips">
            <label class="chip"><input type="checkbox" id="f-live" checked>🚚 Posición en vivo</label>
            <label class="chip"><input type="checkbox" id="f-delivered" checked>✓ Entregados</label>
            <label class="chip"><input type="checkbox" id="f-failed" checked>✕ No entregados</label>
          </div>
          <div class="mf-grid">
            <label class="mf-field">Tipo
              <select id="f-type"><option value="all">Todos</option><option value="flex">Flex</option><option value="part">Part</option></select></label>
            <label class="mf-field">Zona
              <select id="f-zone"><option value="all">Todas</option></select></label>
          </div>
          <div><button class="mf-btn" onclick="resetFilters()">Limpiar filtros</button></div>
        </div>
        <div class="mf-summary">
          <span id="map-count"></span>
          <div class="map-legend">
            <div class="legend-item"><span style="font-size:13px;line-height:1">🚚</span>Posición</div>
            <div class="legend-item"><div class="legend-dot green"></div>Entregado</div>
            <div class="legend-item"><div class="legend-dot orange"></div>No entregado</div>
          </div>
        </div>
      </div>
      <div id="leaflet-map"></div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-ts" id="footer-ts">Sin datos aún</div>
    <div class="conn-badge connected" id="conn-badge"><div class="conn-dot"></div>Conectado</div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const app = initializeApp({
  apiKey:"AIzaSyC8SLmgOK2LfnzK-PiZQKCl9WdVfO4ISys",
  authDomain:"chofer-ml.firebaseapp.com",
  databaseURL:"https://chofer-ml-default-rtdb.firebaseio.com",
  projectId:"chofer-ml",
  storageBucket:"chofer-ml.firebasestorage.app",
  messagingSenderId:"648556111731",
  appId:"1:648556111731:web:298b201b8b9f0f5c47c706"
});
const db = getDatabase(app);

const ZONES={'zona-1':'Zona 1','zona-2':'Zona 2','zona-3':'Zona 3','zona-4':'Zona 4','zona-5':'Zona 5','zona-6':'Zona 6','lanus-avellaneda':'Lanús/Avellaneda','lomas-de-zamora':'Lomas de Zamora','florencio-varela-berazategui':'Florencio Varela/Berazategui','quilmes-almirante-brown':'Quilmes/Almirante Brown','almirante-brown-guernica':'Almirante Brown/Guernica','ezeiza-canuelas':'Ezeiza/Cañuelas','la-plata':'La Plata','tres-febrero-hurlingham':'Tres de Febrero/Hurlingham','merlo-marcos-paz':'Merlo/Marcos Paz','moron-ituzaingo':'Morón/Ituzaingó','la-matanza-sur':'La Matanza Sur','la-matanza-norte':'La Matanza Norte','moreno':'Moreno','general-rodriguez-lujan':'General Rodriguez/Luján','pilar':'Pilar','escobar':'Escobar','tigre':'Tigre','jose-c-paz-malvinas':'José C. Paz/Malvinas Argentinas','san-isidro':'San Isidro','vicente-lopez':'Vicente López','san-martin':'San Martín','otro':'Otro'};

function todayStr(){return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-')}
function todayFmt(){return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',weekday:'long',day:'numeric',month:'long'})}
function fmtTime(iso){if(!iso)return '';return new Date(iso).toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',second:'2-digit'})}
function fmtDT(iso){if(!iso)return '';return new Date(iso).toLocaleString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function zn(k){return esc(ZONES[k]||k||'—')}
const NON_ZONE=['_meta','_inicio','_live','deliveredRecords','failedPackages'];
// Part que le faltan a un chofer: suma de las zonas (total − entregados − fallidos de tipo Part)
function partLeft(d){return Object.entries(d||{}).reduce((n,[k,z])=>NON_ZONE.includes(k)||typeof z!=='object'?n:n+Math.max(0,(z.partTotal||0)-(z.partDelivered||0)-(z.partFailed||0)),0)}
function partTag(t){return t==='part'?'<span class="tag-part">PART</span>':''}
function ini(n){return n?esc(n.charAt(0).toUpperCase()):'?'}
function validCoords(lat,lng){return typeof lat==='number'&&typeof lng==='number'&&lat!==0&&lng!==0&&Math.abs(lat)<90&&Math.abs(lng)<180}
function setConn(ok){const b=document.getElementById('conn-badge');b.className=`conn-badge ${ok?'connected':'disconnected'}`;b.innerHTML=`<div class="conn-dot"></div>${ok?'Conectado':'Sin conexión'}`}
function bump(el){if(!el)return;el.classList.remove('bumping');void el.offsetWidth;el.classList.add('bumping');el.addEventListener('animationend',()=>el.classList.remove('bumping'),{once:true})}

const apodos={};
const prevTotals={};
let allDriverData={};
let currentUid=null;
let detailUnsub=null;
let currentTab='reparto';

// ── Leaflet ───────────────────────────────────────────────────────────────────
let map=null;
let mapInitialized=false;
let liveLayer=null,evLayer=null;
let visiblePts=[];
let openKey=null,rebuilding=false;
const VEH={camion:'🚚',furgoneta:'🚐',auto:'🚗',moto:'🏍️',bici:'🚲'};
const STALE_MS=10*60*1000;   // la app envía cada 3 min: 10 min sin señal = desconectado
const F={driver:'all',live:true,delivered:true,failed:true,type:'all',zone:'all'};

function initMap(){
  if(mapInitialized)return;
  mapInitialized=true;
  map=L.map('leaflet-map',{zoomControl:true}).setView([-34.65,-58.55],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:19}).addTo(map);
  liveLayer=L.layerGroup().addTo(map);
  evLayer=L.layerGroup().addTo(map);
  map.on('popupopen',e=>{openKey=e.popup._source?.options.key||null});
  map.on('popupclose',()=>{if(!rebuilding)openKey=null});
  renderMap();
}

function makeIcon(color,size=12){
  return L.divIcon({
    className:'',
    html:`<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2px solid white;box-shadow:0 2px 6px rgba(0,0,0,.6)"></div>`,
    iconSize:[size,size],iconAnchor:[size/2,size/2]
  });
}

// Vehículo con el nombre encima, apoyado 10px arriba del punto para no tapar marcadores de entrega
function makeVehicleIcon(emoji,label,dim){
  return L.divIcon({
    className:'',
    html:`<div style="display:flex;flex-direction:column;align-items:center;opacity:${dim?.55:1}">
      <div style="background:rgba(0,0,0,.8);color:white;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;white-space:nowrap">${label}</div>
      <div style="font-size:24px;line-height:26px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))">${emoji}</div>
    </div>`,
    iconSize:[120,44],iconAnchor:[60,54]
  });
}

function fmtAge(ms){
  const m=Math.floor(ms/60000);
  if(m<1)return 'hace instantes';
  if(m<60)return `hace ${m} min`;
  return `hace ${Math.floor(m/60)} h ${m%60} min`;
}

function reasonOf(p){return (p.reasonDetail&&p.reasonDetail!=='')?p.reasonDetail:(p.reasonDisplay||p.reason||'Sin motivo')}

// Último paquete registrado (respaldo cuando la app no envía posición en vivo)
function lastEvent(d){
  let best=null;
  [d['deliveredRecords'],d['failedPackages']].forEach(g=>Object.values(g||{}).forEach(r=>{
    const lat=Number(r.lat||0),lng=Number(r.lng||0);
    if(validCoords(lat,lng)&&(!best||r.timestamp>best.ts))best={lat,lng,ts:r.timestamp};
  }));
  return best;
}

// Filtros aplicables a entregas y no entregados
function passEvent(r){
  if(F.type!=='all'&&(r.type||'flex')!==F.type)return false;
  if(F.zone!=='all'&&r.zoneKey!==F.zone)return false;
  return true;
}

function renderLive(){
  if(!map)return;
  liveLayer.clearLayers();
  if(!F.live)return;
  Object.entries(allDriverData).forEach(([uid,d])=>{
    if(F.driver!=='all'&&F.driver!==uid)return;
    const apodo=esc(apodos[uid]||d['_meta']?.userName||uid.slice(0,8));
    const live=d['_live'];
    const isLive=live&&typeof live.ts==='number'&&validCoords(live.lat,live.lng);
    let lat,lng,age,emoji,note='';
    if(isLive){
      lat=live.lat;lng=live.lng;age=Date.now()-live.ts;emoji=VEH[live.vehicle]||VEH.camion;
    }else{
      const le=lastEvent(d);
      if(!le)return;
      lat=le.lat;lng=le.lng;age=null;emoji=VEH.camion;note='Último paquete registrado (sin GPS en vivo)';
    }
    const finished=!!d['_meta']?.finishedAt;
    const stale=isLive&&age>STALE_MS;
    const status=finished?'Jornada finalizada':(stale?'Sin señal':(isLive?'En vivo':''));
    const label=apodo+(isLive?` · ${fmtAge(age)}`:' · últ. paquete');
    L.marker([lat,lng],{icon:makeVehicleIcon(emoji,label,finished||stale||!isLive),zIndexOffset:-500})
      .bindPopup(`<div class="popup-title blue">${emoji} ${apodo}</div>
        ${status?`<div class="popup-row"><span>${status}</span></div>`:''}
        ${isLive?`<div class="popup-row">Posición ${fmtAge(age)}</div>`:`<div class="popup-row">${note}</div>`}`)
      .addTo(liveLayer);
    visiblePts.push([lat,lng]);
  });
}

function renderMap(){
  if(!map)return;
  rebuilding=true;
  evLayer.clearLayers();
  visiblePts=[];
  let nD=0,nF=0,reopen=null;

  Object.entries(allDriverData).forEach(([uid,d])=>{
    if(F.driver!=='all'&&F.driver!==uid)return;
    const apodo=esc(apodos[uid]||d['_meta']?.userName||uid.slice(0,8));

    if(F.delivered)Object.entries(d['deliveredRecords']||{}).forEach(([id,r])=>{
      const lat=Number(r.lat||0),lng=Number(r.lng||0);
      if(!validCoords(lat,lng)||!passEvent(r))return;
      const key=`${uid}/d/${id}`;
      const mk=L.marker([lat,lng],{icon:makeIcon('#0b8a5f',14),key})
        .bindPopup(`<div class="popup-title green">✓ Entregado${partTag(r.type)}</div>
          <div class="popup-row"><span>${apodo}</span></div>
          <div class="popup-row">${zn(r.zoneKey)}</div>
          <div class="popup-row">${fmtDT(r.timestamp)}</div>
          ${r.address?`<div class="popup-row">📍 <span>${esc(r.address)}</span></div>`:''}`)
        .addTo(evLayer);
      if(key===openKey)reopen=mk;
      visiblePts.push([lat,lng]);nD++;
    });

    // Un no entregado reintentado con éxito ya figura como entregado (registro "_retry")
    if(F.failed)Object.entries(d['failedPackages']||{}).forEach(([id,p])=>{
      if(p.retriedSuccess)return;
      const lat=Number(p.lat||0),lng=Number(p.lng||0);
      if(!validCoords(lat,lng)||!passEvent(p))return;
      const reason=reasonOf(p);
      const key=`${uid}/f/${id}`;
      const mk=L.marker([lat,lng],{icon:makeIcon('#d9631e',14),key})
        .bindPopup(`<div class="popup-title orange">✕ No entregado${partTag(p.type)}</div>
          <div class="popup-row"><span>${apodo}</span></div>
          <div class="popup-row">${zn(p.zoneKey)}</div>
          <div class="popup-row">${fmtDT(p.timestamp)}</div>
          <div class="popup-row" style="color:#d9631e">Motivo: ${esc(reason)}</div>
          ${p.address?`<div class="popup-row">📍 <span>${esc(p.address)}</span></div>`:''}`)
        .addTo(evLayer);
      if(key===openKey)reopen=mk;
      visiblePts.push([lat,lng]);nF++;
    });
  });

  renderLive();
  rebuilding=false;
  if(reopen)reopen.openPopup();
  const nLive=liveLayer.getLayers().length;
  document.getElementById('map-count').textContent=`${nLive} chofer${nLive===1?'':'es'} · ✓ ${nD} · ✕ ${nF}`;
}

function readFilters(){
  const v=id=>document.getElementById(id);
  F.driver=v('map-driver-select').value;
  F.live=v('f-live').checked;F.delivered=v('f-delivered').checked;F.failed=v('f-failed').checked;
  F.type=v('f-type').value;F.zone=v('f-zone').value;
  // Insignia del botón: filtros distintos del valor por defecto
  const n=[F.driver!=='all',!F.live,!F.delivered,!F.failed,F.type!=='all',F.zone!=='all'].filter(Boolean).length;
  const b=v('mf-badge');b.textContent=n;b.style.display=n?'inline-block':'none';
}

function applyMapFilter(){
  readFilters();
  updateFilterOptions();
  renderMap();
  fitMapToVisible();
}

function resetFilters(){
  document.getElementById('map-driver-select').value='all';
  ['f-live','f-delivered','f-failed'].forEach(id=>document.getElementById(id).checked=true);
  ['f-type','f-zone'].forEach(id=>document.getElementById(id).value='all');
  applyMapFilter();
}

function toggleFilters(){document.getElementById('mf-panel').classList.toggle('open')}
Object.assign(window,{applyMapFilter,resetFilters,toggleFilters});

function fitMapToVisible(){
  if(!map||visiblePts.length===0)return;
  map.fitBounds(L.latLngBounds(visiblePts).pad(0.25),{maxZoom:16});
}

function updateMapDriverSelect(){
  const sel=document.getElementById('map-driver-select');
  const current=sel.value;
  while(sel.options.length>1)sel.remove(1);
  Object.keys(allDriverData).forEach(uid=>{
    const opt=document.createElement('option');
    opt.value=uid;opt.textContent=apodos[uid]||uid.slice(0,8);
    sel.appendChild(opt);
  });
  sel.value=current||'all';
  if(sel.value!==current)sel.value='all';
}

// Zonas disponibles según el chofer elegido; conserva la selección si sigue existiendo
function updateFilterOptions(){
  const zones=new Set();
  Object.entries(allDriverData).forEach(([uid,d])=>{
    if(F.driver!=='all'&&F.driver!==uid)return;
    Object.values(d['deliveredRecords']||{}).forEach(r=>r.zoneKey&&zones.add(r.zoneKey));
    Object.values(d['failedPackages']||{}).forEach(p=>p.zoneKey&&zones.add(p.zoneKey));
  });
  fillSelect('f-zone',[...zones].sort().map(k=>[k,ZONES[k]||k]));
}
function fillSelect(id,pairs){
  const sel=document.getElementById(id);
  const sig=pairs.map(p=>p[0]).join('|');
  if(sel.dataset.sig===sig)return;
  const cur=sel.value;
  while(sel.options.length>1)sel.remove(1);
  pairs.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;sel.appendChild(o)});
  sel.value=pairs.some(p=>p[0]===cur)?cur:'all';
  sel.dataset.sig=sig;
  readFilters();
}

// La antigüedad de la posición ("hace 4 min") se refresca sin esperar a Firebase
setInterval(()=>{if(mapInitialized&&currentTab==='mapa')renderLive()},60000);

// ── Tabs ──────────────────────────────────────────────────────────────────────
window.switchTab=function(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['reparto','mapa'][i]===tab));
  document.getElementById('screen-reparto').classList.toggle('active',tab==='reparto');
  document.getElementById('screen-mapa').classList.toggle('active',tab==='mapa');
  if(tab==='mapa'){
    initMap();
    setTimeout(()=>{if(map){map.invalidateSize();fitMapToVisible()}},150);
  }
};

// ── Detail nav ────────────────────────────────────────────────────────────────
window.goBack=function(){
  document.getElementById('view-list').style.display='flex';
  document.getElementById('view-detail').classList.remove('active');
  if(detailUnsub){detailUnsub();detailUnsub=null}
  currentUid=null;
};

window.openDetail=function(uid){
  currentUid=uid;
  document.getElementById('view-list').style.display='none';
  document.getElementById('view-detail').classList.add('active');
  document.getElementById('detail-body').innerHTML='<div class="waiting">Cargando...</div>';
  if(detailUnsub){detailUnsub();detailUnsub=null}
  detailUnsub=onValue(ref(db,`jornadas/${todayStr()}/${uid}`),snap=>{
    if(!snap.exists()){document.getElementById('detail-body').innerHTML='<div class="waiting">Sin datos</div>';return}
    renderDetail(uid,snap.val());
  });
};

// ── Main listener ─────────────────────────────────────────────────────────────
onValue(ref(db,`jornadas/${todayStr()}`),snap=>{
  setConn(true);
  if(!snap.exists()){
    document.getElementById('drivers-container').innerHTML='<div class="waiting">Esperando datos de los choferes...</div>';
    ['g-delivered','g-remaining','g-failed'].forEach(id=>document.getElementById(id).textContent='0');
    document.getElementById('g-part').style.display='none';
    return;
  }
  const data=snap.val();
  allDriverData=data;
  Object.entries(data).forEach(([uid,d])=>{apodos[uid]=d['_meta']?.userName||uid.slice(0,8)});
  updateMapDriverSelect();
  updateFilterOptions();
  if(mapInitialized)renderMap();

  let gD=0,gF=0,gR=0,latestTs='';
  Object.entries(data).forEach(([uid,d])=>{
    const m=d['_meta']||{};
    gD+=m.totalDelivered||0;gF+=m.totalFailed||0;gR+=m.totalRemaining||0;
    if(m.updatedAt&&m.updatedAt>latestTs)latestTs=m.updatedAt;
  });
  document.getElementById('g-delivered').textContent=gD;
  document.getElementById('g-remaining').textContent=gR;
  document.getElementById('g-failed').textContent=gF;
  const gP=Object.values(data).reduce((n,d)=>n+partLeft(d),0),gPel=document.getElementById('g-part');
  gPel.textContent=gP+' part';gPel.style.display=gP>0?'block':'none';

  const container=document.getElementById('drivers-container');
  container.innerHTML='';
  Object.entries(data).forEach(([uid,d])=>{
    const m=d['_meta']||{};
    const apodo=esc(apodos[uid]||m.userName||uid.slice(0,8));
    const delivered=m.totalDelivered||0,failed=m.totalFailed||0,remaining=m.totalRemaining||0;
    const pl=partLeft(d);
    const isFinished=!!m.finishedAt;
    const prev=prevTotals[uid]||{};
    const didD=delivered>(prev.delivered||0),didF=failed>(prev.failed||0);
    prevTotals[uid]={delivered,failed,remaining};
    const card=document.createElement('div');
    card.className=`driver-card${!isFinished?' active-now':''}`;
    card.id=`driver-${uid}`;card.onclick=()=>window.openDetail(uid);
    card.innerHTML=`
      <div class="driver-header">
        <div class="driver-avatar">${ini(apodo)}</div>
        <div class="driver-info">
          <div class="driver-name">${apodo}</div>
          ${m.activeZone&&!isFinished?`<div class="driver-zone">📍 ${zn(m.activeZone)}</div>`:''}
        </div>
        <div class="driver-status ${isFinished?'finished':'active'}">${isFinished?'Finalizado':'En ruta'}</div>
      </div>
      <div class="driver-stats">
        <div class="driver-stat"><div class="driver-stat-num green" id="d-${uid}-d">${delivered}</div><div class="driver-stat-label">Entregados</div></div>
        <div class="driver-stat"><div class="driver-stat-num red" id="d-${uid}-f">${failed}</div><div class="driver-stat-label">No entreg.</div></div>
        <div class="driver-stat"><div class="driver-stat-num amber" id="d-${uid}-r">${remaining}</div><div class="driver-stat-label">Restantes</div>${pl>0?`<div class="part-left">${pl} part</div>`:''}</div>
      </div>
      <div class="driver-hint">Tocá para ver detalle →</div>`;
    container.appendChild(card);
    if(didD){setTimeout(()=>{bump(document.getElementById(`d-${uid}-d`));bump(document.getElementById(`d-${uid}-r`))},50)}
    if(didF){setTimeout(()=>{bump(document.getElementById(`d-${uid}-f`));bump(document.getElementById(`d-${uid}-r`))},50)}
  });
  document.getElementById('footer-ts').textContent=latestTs?'Actualizado '+fmtTime(latestTs):'Sin datos aún';
  if(currentUid&&data[currentUid])renderDetail(currentUid,data[currentUid]);
},err=>{console.error(err);setConn(false)});

// ── Detail render ─────────────────────────────────────────────────────────────
function renderDetail(uid,d){
  const m=d['_meta']||{};
  const apodo=esc(apodos[uid]||m.userName||uid.slice(0,8));
  const isFinished=!!m.finishedAt;
  const pl=partLeft(d);
  const delivered=m.totalDelivered||0,failed=m.totalFailed||0,total=m.totalPackages||0,remaining=m.totalRemaining||0;
  const pct=total>0?Math.round((delivered+failed)/total*100):0;
  document.getElementById('detail-title').innerHTML=apodo;
  document.getElementById('detail-sub').textContent=
    `${isFinished?'Finalizado':'En ruta'} · ${fmtDT(m.startedAt)}${m.finishedAt?' → '+fmtDT(m.finishedAt):''}`;

  const events=[];
  const dr=d['deliveredRecords']||{};
  Object.entries(dr).forEach(([id,r])=>events.push({
    type:'delivered',pkg:r.type||'flex',zoneName:esc(r.zoneName)||zn(r.zoneKey),
    timestamp:r.timestamp||'',address:r.address||'',reason:'',retried:false
  }));
  const fp=d['failedPackages']||{};
  Object.entries(fp).forEach(([id,p])=>{
    const reason=(p.reasonDetail&&p.reasonDetail!=='')?p.reasonDetail:(p.reasonDisplay||p.reason||'');
    events.push({type:'failed',pkg:p.type||'flex',zoneName:esc(p.zoneName)||zn(p.zoneKey),
      timestamp:p.timestamp||'',address:p.address||'',reason,retried:p.retriedSuccess||false});
  });
  events.sort((a,b)=>a.timestamp.localeCompare(b.timestamp));

  const rc={};
  events.filter(e=>e.type==='failed'&&!e.retried).forEach(e=>{const r=e.reason||'Sin motivo';rc[r]=(rc[r]||0)+1});
  const re=Object.entries(rc).sort((a,b)=>b[1]-a[1]);

  let html=`
  <div class="detail-summary">
    <div class="detail-avatar">${ini(apodo)}</div>
    <div><div class="detail-name">${apodo}</div>
    <div class="detail-meta">${pct}% gestionado · ${total} paquetes · ${isFinished?'✅ Finalizado':'🟢 En ruta'}${pl>0?` · <span style="color:var(--amber);font-weight:600">${pl} part restantes</span>`:''}</div></div>
  </div>
  <div class="detail-stats" style="margin-top:8px">
    <div class="detail-stat"><div class="detail-stat-num green">${delivered}</div><div class="detail-stat-label">Entregados</div></div>
    <div class="detail-stat"><div class="detail-stat-num" style="color:var(--orange)">${failed}</div><div class="detail-stat-label">No entreg.</div></div>
    <div class="detail-stat"><div class="detail-stat-num amber">${remaining}</div><div class="detail-stat-label">Restantes</div></div>
    <div class="detail-stat"><div class="detail-stat-num white">${pct}%</div><div class="detail-stat-label">Gestión</div></div>
  </div>`;

  if(re.length>0){
    html+=`<div class="section-title" style="margin-top:16px">Motivos de no entrega</div>`;
    re.forEach(([r,c])=>html+=`<div class="reason-row"><span class="reason-name">${esc(r)}</span><span class="reason-count">${c}</span></div>`);
  }

  html+=`<div class="section-title" style="margin-top:16px">Paquetes · ${events.length} registros</div>`;
  if(events.length===0){
    html+=`<div class="waiting">Sin paquetes registrados todavía</div>`;
  } else {
    events.forEach(e=>{
      const isD=e.type==='delivered'||e.retried;
      const statusText=e.type==='delivered'?'✓ Entregado':(e.retried?'✓ Reintento exitoso':'✕ No entregado');
      const cls=isD?'delivered':'failed';
      html+=`
      <div class="pkg ${cls}">
        <div class="pkg-row1"><span class="pkg-status ${cls}">${statusText}${partTag(e.pkg)}</span><span class="pkg-time">${fmtDT(e.timestamp)}</span></div>
        <div class="pkg-zone">${e.zoneName}</div>
        <div class="pkg-loc"><span>📍</span><span style="color:${e.address?'var(--text2)':'var(--text3)'}">${esc(e.address)||'Sin ubicación'}</span></div>
        ${!isD&&e.reason?`<div class="pkg-reason">Motivo: ${esc(e.reason)}</div>`:''}
      </div>`;
    });
  }
  document.getElementById('detail-body').innerHTML=html;
}
</script>
