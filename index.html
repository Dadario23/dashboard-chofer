<!DOCTYPE html>
<html lang="es-AR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0e0e0e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Panel de Reparto · Depósito</title>
    <style>
        /* Vercel-inspired Design System — Dark Theme */
        :root {
            --bg-primary:        #0e0e0e;
            --color-delivered:   #25c490;
            --color-remaining:   #e89b2a;
            --color-failed:      #e05555;

            --green-bg:          #0d2e22;
            --green-border:      rgba(37,196,144,.3);
            --amber-bg:          #2d1f0a;
            --red-bg:            #2e1111;
            --red-border:        rgba(224,85,85,.3);

            --fg-primary:        oklch(90% 0.005 250);
            --fg-secondary:      oklch(70% 0.005 250);
            --fg-muted:          oklch(45% 0.005 250);
            --surface-primary:   oklch(10% 0.005 250);
            --surface-secondary: oklch(13% 0.005 250);
            --border-color:      oklch(20% 0.005 250);

            --shadow-border:     rgba(255,255,255,.08) 0 0 0 1px;
            --shadow-card:       var(--shadow-border), rgba(255,255,255,.04) 0 2px 2px, rgba(15,15,15,1) 0 0 0 1px;

            --font-sans:         -apple-system, BlinkMacSystemFont, 'Geist', 'Segoe UI', system-ui, sans-serif;
            --font-mono:         'Geist Mono', ui-monospace, 'Roboto Mono', Menlo, monospace;

            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-pill: 9999px;

            --space-1: 8px;
            --space-2: 16px;
            --space-3: 24px;
            --space-4: 32px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            background: var(--bg-primary);
            color: var(--fg-primary);
            font-family: var(--font-sans);
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .page { display: flex; flex-direction: column; min-height: 100dvh; }

        /* ── HEADER ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: var(--space-2) var(--space-3);
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }
        .header-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -.4px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-delivered);
            text-transform: uppercase;
            letter-spacing: .6px;
        }
        .live-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--color-delivered);
            animation: pulse-dot 1.8s ease-in-out infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.3} }
        .header-date {
            font-size: 13px;
            color: var(--fg-secondary);
        }

        /* ── MAIN ── */
        main {
            flex: 1;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: var(--space-3) var(--space-2);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .section-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
            font-weight: 600;
            color: var(--fg-muted);
            margin-bottom: -8px;
        }

        /* ── GLOBAL METRICS ── */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--space-2);
        }
        .metric-card {
            background: var(--surface-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            padding: var(--space-3) var(--space-2);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 6px;
            min-height: 110px;
            justify-content: center;
        }
        .metric-card.green { background: var(--green-bg); box-shadow: var(--shadow-card), 0 0 0 1px var(--green-border); }
        .metric-card.amber { background: var(--amber-bg); box-shadow: var(--shadow-card), 0 0 0 1px rgba(232,155,42,.3); }
        .metric-card.red   { background: var(--red-bg);   box-shadow: var(--shadow-card), 0 0 0 1px var(--red-border); }
        .metric-value {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            font-feature-settings: "tnum" on;
        }
        .metric-card.green .metric-value { color: var(--color-delivered); }
        .metric-card.amber .metric-value { color: var(--color-remaining); }
        .metric-card.red   .metric-value { color: var(--color-failed); }
        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .6px;
            font-weight: 600;
            color: var(--fg-secondary);
        }
        .metric-card.green .metric-label { color: var(--color-delivered); }
        .metric-card.amber .metric-label { color: var(--color-remaining); }
        .metric-card.red   .metric-label { color: var(--color-failed); }

        /* ── DRIVER CARDS GRID ── */
        .drivers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-2);
        }

        .driver-card {
            background: var(--surface-secondary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow .3s;
        }
        .driver-card.active-now {
            box-shadow: var(--shadow-card), 0 0 0 1px var(--green-border);
        }

        .driver-header {
            display: flex;
            align-items: center;
            gap: var(--space-1);
            padding: var(--space-2);
            border-bottom: 1px solid var(--border-color);
        }
        .driver-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: var(--green-bg);
            border: 2px solid var(--green-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--color-delivered);
            flex-shrink: 0;
        }
        .driver-info { flex: 1; min-width: 0; }
        .driver-name {
            font-size: 16px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .driver-zone {
            font-size: 12px;
            color: var(--color-delivered);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .driver-status {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            text-transform: uppercase;
            letter-spacing: .4px;
            flex-shrink: 0;
        }
        .driver-status.active {
            color: var(--color-delivered);
            background: var(--green-bg);
            border: 1px solid var(--green-border);
        }
        .driver-status.finished {
            color: var(--fg-muted);
            background: transparent;
            border: 1px solid var(--border-color);
        }

        .driver-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            border-bottom: 1px solid var(--border-color);
        }
        .driver-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: var(--space-2) var(--space-1);
            border-right: 1px solid var(--border-color);
        }
        .driver-stat:last-child { border-right: none; }
        .driver-stat-value {
            font-size: 30px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -.04em;
            font-feature-settings: "tnum" on;
        }
        .driver-stat-value.green { color: var(--color-delivered); }
        .driver-stat-value.amber { color: var(--color-remaining); }
        .driver-stat-value.red   { color: var(--color-failed); }
        .driver-stat-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--fg-muted);
            margin-top: 4px;
        }

        .driver-progress {
            padding: 10px var(--space-2);
            border-bottom: 1px solid var(--border-color);
        }
        .progress-track {
            height: 6px;
            background: var(--border-color);
            border-radius: var(--radius-pill);
            overflow: hidden;
            display: flex;
            margin-bottom: 6px;
        }
        .progress-g {
            height: 100%;
            background: var(--color-delivered);
            border-radius: var(--radius-pill);
            transition: width .6s ease;
        }
        .progress-r {
            height: 100%;
            background: var(--color-failed);
            border-radius: var(--radius-pill);
            transition: width .6s ease;
        }
        .progress-txt {
            font-size: 11px;
            color: var(--fg-secondary);
            text-align: center;
            font-family: var(--font-mono);
        }

        .driver-zones {
            padding: var(--space-1) var(--space-2) var(--space-2);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .zone-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .zone-active-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--color-delivered);
            flex-shrink: 0;
            animation: pulse-dot 1.4s ease-in-out infinite;
        }
        .zone-spacer { width: 6px; flex-shrink: 0; }
        .zone-name { font-size: 12px; color: var(--fg-secondary); flex: 1; }
        .zone-num {
            font-size: 12px;
            font-weight: 600;
            min-width: 28px;
            text-align: right;
            font-family: var(--font-mono);
        }

        /* ── FOOTER ── */
        footer {
            background: var(--surface-primary);
            border-top: 1px solid var(--border-color);
            padding: var(--space-1) var(--space-3);
        }
        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: var(--space-2);
        }
        .footer-ts { font-size: 11px; color: var(--fg-muted); font-family: var(--font-mono); }

        .conn-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: var(--radius-pill);
            border: 1px solid;
        }
        .conn-badge.connected { color: var(--color-delivered); border-color: var(--green-border); background: var(--green-bg); }
        .conn-badge.disconnected { color: var(--color-failed); border-color: var(--red-border); background: var(--red-bg); }
        .conn-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

        .waiting {
            text-align: center;
            padding: 40px 20px;
            color: var(--fg-muted);
            font-size: 14px;
            font-style: italic;
        }

        /* ── ANIMATIONS ── */
        @keyframes bump {
            0%   { transform: scale(1); }
            40%  { transform: scale(1.18); }
            100% { transform: scale(1); }
        }
        .bumping { animation: bump .35s cubic-bezier(.34,1.56,.64,1); }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .metrics-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
            .metric-value { font-size: 36px; }
            main { padding: var(--space-2) var(--space-1); }
            header { padding: var(--space-1) var(--space-2); }
        }
    </style>
</head>
<body>
<div class="page">

    <header>
        <div class="header-inner">
            <div class="header-title">Panel de Reparto</div>
            <div class="header-right">
                <div class="live-badge"><div class="live-dot"></div>En vivo</div>
                <div class="header-date" id="header-date">Cargando...</div>
            </div>
        </div>
    </header>

    <main>
        <div class="section-label">Totales del día</div>
        <div class="metrics-grid">
            <div class="metric-card green">
                <div class="metric-value" id="g-delivered">—</div>
                <div class="metric-label">Entregados</div>
            </div>
            <div class="metric-card amber">
                <div class="metric-value" id="g-remaining">—</div>
                <div class="metric-label">Restantes</div>
            </div>
            <div class="metric-card red">
                <div class="metric-value" id="g-failed">—</div>
                <div class="metric-label">No entreg.</div>
            </div>
        </div>

        <div class="section-label">Choferes en ruta</div>
        <div class="drivers-grid" id="drivers-container">
            <div class="waiting">Esperando datos de los choferes...</div>
        </div>
    </main>

    <footer>
        <div class="footer-inner">
            <div class="footer-ts" id="footer-ts">Sin datos aún</div>
            <div class="conn-badge connected" id="conn-badge">
                <div class="conn-dot"></div>Conectado
            </div>
        </div>
    </footer>

</div>

<!-- ── FIREBASE LOGIC (original sin modificaciones) ── -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey:"AIzaSyC8SLmgOK2LfnzK-PiZQKCl9WdVfO4ISys",
  authDomain:"chofer-ml.firebaseapp.com",
  databaseURL:"https://chofer-ml-default-rtdb.firebaseio.com",
  projectId:"chofer-ml",
  storageBucket:"chofer-ml.firebasestorage.app",
  messagingSenderId:"648556111731",
  appId:"1:648556111731:web:298b201b8b9f0f5c47c706"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const ZONE_NAMES = {
  'florencio-varela-berazategui':'Florencio Varela/Berazategui','la-plata':'La Plata',
  'quilmes':'Quilmes','lomas-de-zamora':'Lomas de Zamora','esteban-etcheverria':'Esteban Etcheverría',
  'ezeiza':'Ezeiza','zona-1':'Zona 1','zona-2':'Zona 2','zona-3':'Zona 3',
  'zona-4':'Zona 4','zona-5':'Zona 5','pilar':'Pilar'
};

function todayStr(){
  return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    year:'numeric',month:'2-digit',day:'2-digit'}).split('/').reverse().join('-');
}
function todayFmt(){
  return new Date().toLocaleDateString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    weekday:'long',day:'numeric',month:'long'});
}
function fmtTime(iso){
  if(!iso) return '';
  return new Date(iso).toLocaleTimeString('es-AR',{timeZone:'America/Argentina/Buenos_Aires',
    hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function zoneName(k){ return ZONE_NAMES[k] || k || '—'; }
function initials(name){ return name ? name.charAt(0).toUpperCase() : '?'; }
function bump(el){ if(!el) return; el.classList.remove('bumping'); void el.offsetWidth; el.classList.add('bumping'); el.addEventListener('animationend',()=>el.classList.remove('bumping'),{once:true}); }
function setConnected(ok){
  const b=document.getElementById('conn-badge');
  b.className=`conn-badge ${ok?'connected':'disconnected'}`;
  b.innerHTML=`<div class="conn-dot"></div>${ok?'Conectado':'Sin conexión'}`;
}

document.getElementById('header-date').textContent = todayFmt();

const prevTotals = {};
const apodos = {};

onValue(ref(db,'usuarios'), snap => {
  if(!snap.exists()) return;
  snap.forEach(child => {
    const uid  = child.key;
    const data = child.val();
    apodos[uid] = data.apodo || uid;
  });
});

onValue(ref(db, `jornadas/${todayStr()}`), (snapshot) => {
  setConnected(true);

  if(!snapshot.exists()){
    document.getElementById('drivers-container').innerHTML =
      '<div class="waiting">Esperando datos de los choferes...</div>';
    return;
  }

  const data = snapshot.val();
  const drivers = Object.entries(data);
  if(drivers.length === 0) return;

  let gDelivered=0, gFailed=0, gRemaining=0, latestTs='';

  drivers.forEach(([uid, driverData]) => {
    const meta = driverData['_meta'] || {};
    gDelivered += meta.totalDelivered || 0;
    gFailed    += meta.totalFailed    || 0;
    gRemaining += meta.totalRemaining || 0;
    if(meta.updatedAt && meta.updatedAt > latestTs) latestTs = meta.updatedAt;
  });

  document.getElementById('g-delivered').textContent = gDelivered;
  document.getElementById('g-remaining').textContent = gRemaining;
  document.getElementById('g-failed').textContent    = gFailed;

  const container = document.getElementById('drivers-container');
  container.innerHTML = '';

  drivers.forEach(([uid, driverData]) => {
    const meta       = driverData['_meta'] || {};
    const apodo      = apodos[uid] || meta.userName || uid.slice(0,8);
    const activeZone = meta.activeZone || '';
    const delivered  = meta.totalDelivered || 0;
    const failed     = meta.totalFailed    || 0;
    const remaining  = meta.totalRemaining || 0;
    const total      = meta.totalPackages  || 0;
    const managed    = delivered + failed;
    const pct        = total > 0 ? Math.round(managed/total*100) : 0;
    const isFinished = !!meta.finishedAt;
    const updatedAt  = meta.updatedAt || '';

    const prev       = prevTotals[uid] || {};
    const didDeliver = delivered > (prev.delivered || 0);
    const didFail    = failed    > (prev.failed    || 0);
    prevTotals[uid]  = { delivered, failed, remaining };

    const pctG = total > 0 ? (delivered/total*100) : 0;
    const pctR = total > 0 ? (failed/total*100)    : 0;

    const zoneKeys = Object.keys(driverData).filter(k => k !== '_meta');
    const zonesHtml = zoneKeys.map(key => {
      const z       = driverData[key];
      const isActive = key === activeZone;
      return `
        <div class="zone-row">
          ${isActive ? '<div class="zone-active-dot"></div>' : '<div class="zone-spacer"></div>'}
          <div class="zone-name">${zoneName(key)}</div>
          <div class="zone-num" style="color:var(--color-delivered)">${z.delivered||0}✓</div>
          <div class="zone-num" style="color:var(--color-failed)">${z.failed||0}✕</div>
          <div class="zone-num" style="color:var(--color-remaining)">${z.remaining||0}⏳</div>
        </div>`;
    }).join('');

    const card = document.createElement('div');
    card.className = `driver-card${!isFinished ? ' active-now' : ''}`;
    card.id = `driver-${uid}`;
    card.innerHTML = `
      <div class="driver-header">
        <div class="driver-avatar">${initials(apodo)}</div>
        <div class="driver-info">
          <div class="driver-name">${apodo}</div>
          ${activeZone && !isFinished
            ? `<div class="driver-zone">📍 ${zoneName(activeZone)}</div>`
            : ''}
        </div>
        <div class="driver-status ${isFinished ? 'finished' : 'active'}">
          ${isFinished ? 'Finalizado' : 'En ruta'}
        </div>
      </div>
      <div class="driver-stats">
        <div class="driver-stat">
          <div class="driver-stat-value green" id="d-${uid}-delivered">${delivered}</div>
          <div class="driver-stat-label">Entregados</div>
        </div>
        <div class="driver-stat">
          <div class="driver-stat-value red" id="d-${uid}-failed">${failed}</div>
          <div class="driver-stat-label">No entreg.</div>
        </div>
        <div class="driver-stat">
          <div class="driver-stat-value amber" id="d-${uid}-remaining">${remaining}</div>
          <div class="driver-stat-label">Restantes</div>
        </div>
      </div>
      <div class="driver-progress">
        <div class="progress-track">
          <div class="progress-g" style="width:${pctG}%"></div>
          <div class="progress-r" style="width:${pctR}%"></div>
        </div>
        <div class="progress-txt">${managed} de ${total} gestionados · ${pct}%${updatedAt ? ' · ' + fmtTime(updatedAt) : ''}</div>
      </div>
      ${zoneKeys.length > 0 ? `<div class="driver-zones">${zonesHtml}</div>` : ''}
    `;
    container.appendChild(card);

    if(didDeliver){ setTimeout(()=>{ bump(document.getElementById(`d-${uid}-delivered`)); bump(document.getElementById(`d-${uid}-remaining`)); },50); }
    if(didFail)   { setTimeout(()=>{ bump(document.getElementById(`d-${uid}-failed`));    bump(document.getElementById(`d-${uid}-remaining`)); },50); }
  });

  document.getElementById('footer-ts').textContent =
    latestTs ? 'Actualizado ' + fmtTime(latestTs) : 'Sin datos aún';

}, err => { console.error(err); setConnected(false); });
</script>
</body>
</html>
